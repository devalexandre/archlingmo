<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchLingmo</title>
  <meta name="description" content="ArchLingmo: o desktop Lingmo em Qt 6, sobre o Arch Linux. Download, requisitos e capturas de tela.">
  <meta property="og:title" content="ArchLingmo">
  <meta property="og:description" content="O desktop Lingmo em Qt 6, sobre o Arch Linux.">
  <meta property="og:image" content="assets/hero.jpg">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <nav class="nav">
      <a class="brand" href="#"><img src="assets/logo-white.png" alt="Lingmo"></a>
      <div class="links">
        <a href="#sobre" data-i18n="nav.about">Sobre</a>
        <a href="#recursos" data-i18n="nav.features">Recursos</a>
        <a href="#download" data-i18n="nav.download">Download</a>
        <a href="#requisitos" data-i18n="nav.requirements">Requisitos</a>
        <a href="#capturas" data-i18n="nav.screenshots">Capturas</a>
        <a href="#videos" data-i18n="nav.videos">Vídeos</a>
        <a href="#roadmap" data-i18n="nav.roadmap">Roadmap</a>
        <a href="#comunidade" data-i18n="nav.community">Comunidade</a>
      </div>
      <label class="lang-picker">
        <span class="visually-hidden" data-i18n="lang.label">Idioma</span>
        <select id="lang-select" aria-label="Idioma"></select>
      </label>
    </nav>

    <div class="hero-content">
      <h1 id="site-name">ArchLingmo</h1>
      <p id="site-tagline" class="tagline" data-i18n="hero.tagline">O desktop Lingmo em Qt 6, sobre o Arch Linux.</p>
      <div class="actions">
        <a id="download-button" class="button primary" href="#download" data-i18n="button.download">Baixar ISO</a>
        <a id="discord-button" class="button" href="#comunidade">Discord</a>
        <a id="github-button" class="button" href="https://github.com/devalexandre/lingmo-desktop">GitHub</a>
      </div>
      <p id="iso-meta" class="meta"></p>
    </div>
  </header>

  <main>
    <section id="sobre" class="section" data-md="content/intro.md"></section>
    <section id="recursos" class="section features" data-md="content/recursos.md"></section>
    <section id="download" class="section" data-md="content/download.md"></section>
    <section id="requisitos" class="section" data-md="content/requisitos.md"></section>
    <section id="capturas" class="section gallery" data-md="content/screenshots.md"></section>
    <section id="videos" class="section videos" data-md="content/videos.md"></section>
    <section id="roadmap" class="section roadmap" data-md="content/roadmap.md"></section>
    <section id="comunidade" class="section" data-md="content/comunidade.md"></section>
  </main>

  <footer class="footer">
    <p data-i18n-html="footer">ArchLingmo é um projeto comunitário baseado no <a href="https://lingmo.org">Lingmo OS</a>.
       Código livre sob a GPL.</p>
  </footer>

  <dialog id="lightbox" aria-label="Captura de tela ampliada" data-i18n-aria="lightbox.label">
    <img alt="">
  </dialog>
</body>
</html>
